<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Letter ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <span class="back">‹</span>
      <b>Proposal Letter</b>
      <span class="right">♡ ⋮</span>
    </header>

    <main id="screen">

      <div class="instruction">
        Tap the envelope to open 💌
      </div>

      <div class="envelope" id="envelope">

        <!-- Letter -->
        <div class="letter">

          <div class="small-heart">💗</div>

          <h2>A Little Question</h2>

          <p>
            I have something special<br>
            to ask you...
          </p>

          <h3>Will you be mine? ❤️</h3>

          <div class="buttons">
            <button id="yesBtn">YES 💖</button>
            <button id="noBtn">NO 🙈</button>
          </div>

        </div>

        <!-- Envelope -->
        <div class="envelope-body"></div>

        <div class="flap"></div>

        <div class="seal">♥️</div>

      </div>

      <p class="bottom-text">
        Made with love ✨
      </p>

      <!-- Success -->
      <div class="success" id="success">

        <div class="big-heart">💖</div>

        <h1>Yay! ❤️</h1>

        <p>
          You just made this little<br>
          proposal very special.
        </p>

        <button id="againBtn">
          Open Again
        </button>

      </div>

    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
